---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install apt packages
  apt:
    name:
      - python3
      - python3-pip
      - git
      - ufw
      - default-mysql-server
    state: present

- name: Install pip packages
  pip:
    name:
      - flask
      - requests
      - mysql-connector-python
    executable: pip3

- name: Enable UFW
  ufw:
    state: enabled
    policy: allow

- name: Allow SSH and port 5000
  ufw:
    rule: allow
    port: "{{ item }}"
  loop:
    - 22
    - 5000

- name: Deploy Flask app directory
  file:
    path: /opt/airbooking
    state: directory
    mode: '0755'

- name: Deploy Flask application
  copy:
    src: app.py
    dest: /opt/airbooking/app.py
    mode: '0644'

- name: Create systemd service
  copy:
    dest: /etc/systemd/system/airbooking.service
    mode: '0644'
    content: |
      [Unit]
      Description=Airbooking Flask App
      After=network.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/airbooking/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target
  notify:
    - reload-systemd
    - restart-airbooking

